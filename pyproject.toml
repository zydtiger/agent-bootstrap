[project]
name = "agent-bootstrap"
version = "0.3.0"
description = "Render layered global agent instructions from a manifest"
readme = "README.md"
license = "MIT"
authors = [
  { name = "zydtiger" },
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.21,<1",
]

[project.scripts]
agent-bootstrap = "agent_bootstrap.cli:app"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "agent_bootstrap"
